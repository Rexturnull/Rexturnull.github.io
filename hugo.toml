baseURL = 'https://rexturnull.github.io/'
locale = 'zh-TW'
title = "Rexturnull's Blog"
theme = 'makabaka'
titleCaseStyle = 'none'

[taxonomies]
    category = "categories"
    tag = "tags"

[markup.tableOfContents]
    startLevel = 1
    endLevel = 4

[markup.goldmark.renderer]
    unsafe = true

[params]
    mainSections = ["posts"]
    description = "工程師的數位花園"

[params.author]
    name = "Rex"
    title = "Laid-back Engineer"
    bio = "Go for it, because missing an opportunity hurts much more than rejection."
    avatar = "/img/cover.jpg"
    resume = "/files/resume.pdf"

[params.social]
    github = "https://github.com/rexturnull"
    email = "you@example.com"
    linkedin = "https://www.linkedin.com/in/rexturnull"
    twitter = "https://x.com/your-handle"

# 左側邊欄導覽選單（英文介面）
[[menu.main]]
    name = "Home"
    url = "/"
    weight = 10
[[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 20
[[menu.main]]
    name = "Tags"
    url = "/tags/"
    weight = 30
[[menu.main]]
    name = "About"
    url = "/about/"
    weight = 40

